<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Logo Extrusion</title>
    <style>
        body { margin: 0; background-color: #eee; }
        canvas { display: block; margin: 0 auto; }

    </style>
</head>
<body>
    <canvas id="gl_canvas" width="500" height="500"></canvas>

    <!-- Vertex Shader -->
    <script id="vertex_shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;
        attribute vec4 vColor;
        attribute vec3 vNormal;

        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        uniform mat4 normalMatrix;

        varying vec4 fColor;
        varying vec3 fNormal;

        void main() {
            fColor = vColor;
            fNormal = normalize((normalMatrix * vec4(vNormal, 0.0)).xyz);
            gl_Position = projectionMatrix * modelViewMatrix * vPosition;
        }
    </script>

    <!-- Fragment Shader -->
    <script id="fragment_shader" type="x-shader/x-fragment">
        precision mediump float;
        varying vec4 fColor;
        varying vec3 fNormal;

        void main() {
            vec3 lightDir = normalize(vec3(0.0, 0.0, 1.0));
            float diff = max(dot(fNormal, lightDir), 0.0);
            vec3 ambient = 0.3 * fColor.rgb;          // ambient light
            vec3 diffuse = diff * fColor.rgb;         // diffuse lighting
            gl_FragColor = vec4(ambient + diffuse, fColor.a);
        }
    </script>

    <!-- Import MV.js + Angel & Shreiner utils -->
    <script src="common/MV.js"></script>
    <script src="common/initShaders.js"></script>

    <!-- Your Logo.js -->
    <script src="Logo.js"></script>
</body>
</html>
