<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My Logo</title>

    <!-- link to the common scripts -->
    <script src="../Common/webgl-utils.js"></script>
    <script src="../Common/initShaders.js"></script>
    <script src="../Common/MVnew.js"></script>
    <script src="My_Logo.js"></script>
  </head>
  <body>
    <!-- header -->
    <header id="page_header">
      <div class="header_content">
        <h1>3D Word Logo</h1>
        <p>
          Prepared by : Lim Yi Jie (22304136), Joanne Loi Jin Xu (22303573), Goh
          Shu Ying (22305493), Saw Yee Xuan (22305488)
        </p>
      </div>
    </header>

    <!-- Main Content Container -->
    <div id="main_container">
      <!-- size of the canvas-->
      <canvas id="gl_canvas" width="720" height="820"></canvas>

      <!-- control panel -->
      <div id="control_panel">
        <!-- text input control -->
        <div class="control_group">
          <label for="text_input">Custom Word (ONLY L, O, V, E): </label>
          <input
            type="text"
            id="text_input"
            class="text_input"
            value="L"
            placeholder="Enter text"
          />
        </div>

        <!-- slider row -->
        <div class="double_control_row">
          <div class="control_group">
            <label>Extrusion Depth:</label>
            <div class="slider_container">
              <input
                type="range"
                id="extrusion_slider"
                min="0.0"
                max="0.5"
                step="0.01"
                value="0.10"
              />
              <span id="extrusion_value" class="slider_value">0.10</span>
            </div>
          </div>
          <div class="control_group">
            <label>Animation Speed:</label>
            <div class="slider_container">
              <input
                type="range"
                id="speed_slider"
                min="0.1"
                max="5.0"
                step="0.1"
                value="1.0"
              />
              <span id="speed_value" class="slider_value">1.0</span>
            </div>
          </div>
        </div>
        <div class="control_group">
          <label
            >Manual Rotation Controls (Select "Manual 360" below to use)</label
          >
          <div class="slider_container">
            <label>Rot X:</label>
            <input
              type="range"
              id="rot_x"
              min="0"
              max="360"
              step="0.05"
              value="0"
            />
          </div>
          <div class="slider_container">
            <label>Rot Y:</label>
            <input
              type="range"
              id="rot_y"
              min="0"
              max="360"
              step="0.05"
              value="0"
            />
          </div>
          <div class="slider_container">
            <label>Rot Z:</label>
            <input
              type="range"
              id="rot_z"
              min="0"
              max="360"
              step="0.05"
              value="0"
            />
          </div>
        </div>
        <div class="control_group">
          <label
            >Manual Translation Controls (Select "Manual" below to use)</label
          >
          <div class="slider_container">
            <label>Pos X:</label>
            <input
              type="range"
              id="trans_x"
              min="-0.5"
              max="0.7"
              step="0.05"
              value="0"
            />
          </div>
          <div class="slider_container">
            <label>Pos Y:</label>
            <input
              type="range"
              id="trans_y"
              min="-0.7"
              max="0.6"
              step="0.05"
              value="0"
            />
          </div>
          <div class="slider_container">
            <label>Pos Z:</label>
            <input
              type="range"
              id="trans_z"
              min="-1.5"
              max="1.0"
              step="0.05"
              value="0"
            />
          </div>
        </div>

        <!-- rotation control group -->
        <div class="control_group rotation_control_group">
          <label>Rotation Sequence</label>
          <div class="inline_control_row">
            <select id="rotation_sequence_select">
              <option value="assignment_seq">TV Indent</option>
              <option value="manual_360">Manual 360 Movement</option>
              <option value="left_rotate">Left Rotation</option>
            </select>
            <button id="apply_rotation_button" class="rotation_button">
              Apply
            </button>
          </div>
        </div>

        <!-- lighting control group -->
        <div class="control_group lighting_control_group">
          <label>Lighting</label>
          <div class="inline_control_row">
            <select id="lighting_mode_select">
              <option value="neutral">Neutral</option>
              <option value="soft_glow">Soft Glow</option>
              <option value="dramatic">Dramatic</option>
            </select>
            <button id="apply_lighting_button" class="lighting_button">
              Apply
            </button>
          </div>
        </div>

        <!-- color controls group -->
        <div class="control_group color_controls_group">
          <label class="color_group_label">Color Controls</label>

          <div class="color_layout_row">
            <div class="color_picker_item">
              <label for="color_picker">Primary</label>
              <div class="color_circle" data-circle="primary">
                <input type="color" id="color_picker" value="#ff0000" />
              </div>
            </div>

            <div class="color_picker_item">
              <label for="color_picker_2">Secondary</label>
              <div class="color_circle" data-circle="secondary">
                <input type="color" id="color_picker_2" value="#00ff00" />
              </div>
            </div>

            <div class="color_preset_row">
              <label for="color_preset">Palette:</label>
              <select id="color_preset" class="color_preset_select">
                <option value="custom">Custom</option>
                <option value="sunset_glow">Sunset Glow</option>
                <option value="ocean_wave">Ocean Wave</option>
                <option value="galaxy_mix">Galaxy Mix</option>
                <option value="candy_pastel">Candy Pastel</option>
                <option value="random">Random</option>
              </select>
            </div>
          </div>
        </div>

        <!-- buttons -->
        <div class="button_group">
          <button id="play_pause_button" class="play_pause_button">
            Start
          </button>
          <button id="reset_button">Reset</button>
        </div>

        <!-- info -->
        <div class="info_group">
          <p>Press <kbd>Space</kbd> to Start/Stop</p>
          <p>Press <kbd>R</kbd> to Reset</p>
        </div>
      </div>
    </div>

    <script id="vertex_shader" type="x-shader/x-vertex">
      #version 300 es
      in vec4 vPosition;
      in vec4 vColor;
      in vec3 vNormal;
      out vec4 color;

      // global variables
      uniform mat4 modelViewMatrix;
      uniform mat4 projectionMatrix;
      void main() {
          gl_Position = projectionMatrix * modelViewMatrix * vPosition;
          color = vColor;
      }
    </script>

    <script id="fragment_shader" type="x-shader/x-fragment">
      #version 300 es
      precision mediump float;
      in vec4 color;
      out vec4 fragColor;

      uniform float uLightingFactor;

      void main() {
        fragColor = color * uLightingFactor;
      }
    </script>

    <!-- inline css -->
    <style>
      :root {
        --orange: #f97316;
        --orange-light: #fbbf24;
        --orange-dark: #c2410c;
        --panel: #fff6e6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font: 14px "Comic Sans MS", cursive, sans-serif;
        color: #0f172a;
        background: #fff7ed;
        overflow: hidden;
      }

      #main_container {
        position: relative;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
      }

      #gl_canvas {
        position: fixed;
        top: 80px;
        left: 0;
        width: calc(100vw - 512px);
        height: calc(100vh - 80px);
        border: none;
        border-radius: 0;
        background: #fff7ed;
        box-shadow: none;
        display: block;
        z-index: 1;
      }

      #control_panel {
        position: fixed;
        top: 140px;
        right: 16px;
        width: 480px;
        min-width: 380px;
        max-height: calc(100vh - 160px);
        height: auto;
        background: var(--panel);
        border: 2px solid var(--orange-light);
        border-radius: 12px;
        padding: 16px;
        overflow-y: auto;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.15);
        z-index: 1000;
      }

      #page_header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        background: linear-gradient(120deg, #f78c1f, #ffcc66);
        color: #fffdf5;
        text-align: center;
        padding: 18px 24px;
        box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
        z-index: 999;
      }

      .control_group {
        margin-bottom: 12px;
        padding: 12px;
        background: #fff;
        border-radius: 10px;
        border: 1px solid rgba(249, 115, 22, 0.2);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .control_group label {
        font-weight: 600;
        color: var(--orange-dark);
      }

      .inline_control_row,
      .slider_container {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .double_control_row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .text_input,
      select {
        width: 100%;
        padding: 8px;
        border: 2px solid var(--orange);
        border-radius: 6px;
        font-weight: 600;
        color: var(--orange-dark);
        background: #fff;
      }

      .text_input:focus,
      select:focus {
        outline: 2px solid #fef3c7;
        border-color: var(--orange-dark);
      }

      #text_input {
        max-width: 260px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 4px;
        border-radius: 4px;
        background: #fed7aa;
        accent-color: var(--orange);
        cursor: pointer;
        background-image: linear-gradient(
          to right,
          var(--orange-dark) 0%,
          var(--orange-dark) 2px,
          /* Start Line */ transparent 2px,
          transparent calc(50% - 1px),
          var(--orange-dark) calc(50% - 1px),
          var(--orange-dark) calc(50% + 1px),
          /* Mid Line */ transparent calc(50% + 1px),
          transparent calc(100% - 2px),
          var(--orange-dark) calc(100% - 2px),
          var(--orange-dark) 100% /* End Line */
        );
      }

      .slider_value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 50px;
        padding: 4px 10px;
        background: #fff7ed;
        border: 1px solid #fed7aa;
        border-radius: 6px;
        color: var(--orange-dark);
        font-weight: 600;
        text-align: center;
      }

      .button_group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        flex: 1;
        padding: 10px 16px;
        border-radius: 6px;
        border: none;
        background: #fff8eb;
        color: #b45309;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
      }

      button:hover {
        background: #ffb347;
        color: #fff;
      }

      #reset_button {
        border: 2px solid #f4a259;
        background: #fffaf2;
        color: var(--orange-dark);
      }

      #reset_button:hover {
        border-color: #f97316;
        background: #fff0de;
        color: #a94407;
      }

      /* Play/Pause button - always green or red, never orange */
      #play_pause_button.play_state {
        background: #22c55e !important;
        border: 2px solid #15803d !important;
        color: #fff !important;
      }

      #play_pause_button.play_state:hover {
        background: #16a34a !important;
        border-color: #15803d !important;
        color: #fff !important;
      }

      #play_pause_button.pause_state {
        background: #ef4444 !important;
        border: 2px solid #b91c1c !important;
        color: #fff !important;
      }

      #play_pause_button.pause_state:hover {
        background: #dc2626 !important;
        border-color: #b91c1c !important;
        color: #fff !important;
      }

      .color_controls_group {
        background: #fff6e0;
      }

      .color_layout_row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .color_picker_item {
        flex: 1;
        min-width: 120px;
        text-align: center;
      }

      .color_circle {
        width: 60px;
        height: 60px;
        margin: 0 auto;
        border-radius: 50%;
        border: 3px solid var(--orange);
        position: relative;
        overflow: hidden;
        background: #fff;
        transition: background 0.3s ease;
      }

      .color_circle input[type="color"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        opacity: 0;
      }

      .header_content h1 {
        margin: 0;
        font-size: 2.6em;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .header_content p {
        margin: 8px 0 0;
        font-size: 1.25em;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .info_group {
        padding-top: 12px;
        color: #7c2d12;
      }

      kbd {
        background: #fed7aa;
        border: 1px solid var(--orange);
        border-radius: 4px;
        padding: 2px 6px;
      }

      @media (max-width: 1024px) {
        #gl_canvas {
          width: 100vw;
          height: calc(100vh - 80px - 50vh);
          top: 80px;
          left: 0;
        }

        #control_panel {
          width: calc(100% - 32px);
          max-width: 480px;
          right: 16px;
          left: auto;
          transform: none;
          top: auto;
          bottom: 16px;
          max-height: 50vh;
          height: auto;
          border: 2px solid var(--orange-light);
          border-radius: 12px;
        }

        #page_header {
          right: 0;
        }

        .double_control_row {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        .button_group {
          flex-direction: column;
        }
      }
    </style>
  </body>
</html>
