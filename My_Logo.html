<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My Logo</title>

    <!-- link to the common scripts 连接到公共脚本 -->
    <script src="../Common/webgl-utils.js"></script>
    <script src="../Common/initShaders.js"></script>
    <script src="../Common/MVnew.js"></script>
    <script src="My_Logo.js"></script>
  </head>
  <body>
    <!-- Header -->
    <header id="page_header">
      <div class="header_content">
        <h1>3D Word Logo</h1>
        <p>
          Prepared by : Lim Yi Jie (22304136), Joanne Loi Jin Xu (22303573), Goh
          Shu Ying (22305493), Saw Yee Xuan (22305488)
        </p>
      </div>
    </header>

    <!-- Main Content Container -->
    <div id="main_container">
      <!-- size of the canvas-->
      <canvas id="gl_canvas" width="720" height="820"></canvas>

      <!-- Control Panel -->
      <div id="control_panel">
        <h2></h2>

        <!-- Text Input Control -->
        <div class="control_group">
          <label for="text_input"
            >Custom Word (ONLY L, O, V, E) MAX 4:
          </label>
          <input
            type="text"
            id="text_input"
            class="text_input"
            value="L"
            placeholder="Enter text"
          />
        </div>

        <!-- Slider Row -->
        <div class="double_control_row">
          <div class="control_group">
            <label>Extrusion Depth:</label>
            <div class="slider_container">
              <input
                type="range"
                id="extrusion_slider"
                min="0.0"
                max="0.5"
                step="0.01"
                value="0.10"
              />
              <span id="extrusion_value" class="slider_value">0.10</span>
            </div>
          </div>
          <div class="control_group">
            <label>Animation Speed:</label>
            <div class="slider_container">
              <input
                type="range"
                id="speed_slider"
                min="0.1"
                max="5.0"
                step="0.1"
                value="1.0"
              />
              <span id="speed_value" class="slider_value">1.0</span>
            </div>
          </div>
        </div>
        <div class="control_group">
          <label>Manual Controls (Select "Manual" below to use)</label>
          <div class="slider_container">
            <label>Rot X:</label>
            <input type="range" id="rot_x" min="0" max="360" value="0" />
          </div>
          <div class="slider_container">
            <label>Rot Y:</label>
            <input type="range" id="rot_y" min="0" max="360" value="0" />
          </div>
          <div class="slider_container">
            <label>Rot Z:</label>
            <input type="range" id="rot_z" min="0" max="360" value="0" />
          </div>
        </div>

        <!-- Rotation Control Group -->
        <div class="control_group rotation_control_group">
          <label>Rotation Sequence</label>
          <div class="inline_control_row">
            <select id="rotation_sequence_select">
              <option value="assignment_seq">Assignment Sequence</option>
              <option value="tv_ident_seq">Full TV Ident</option>
              <option value="manual_360">Manual 360 Rotation</option>
              <option value="left_rotate">Left Rotation</option>
            </select>
            <button id="apply_rotation_button" class="rotation_button">
              Apply
            </button>
          </div>
        </div>

        <!-- Lighting Control Group -->
        <div class="control_group lighting_control_group">
          <label>Lighting</label>
          <div class="inline_control_row">
            <select id="lighting_mode_select">
              <option value="neutral">Neutral</option>
              <option value="soft_glow">Soft Glow</option>
              <option value="dramatic">Dramatic</option>
            </select>
            <button id="apply_lighting_button" class="lighting_button">
              Apply
            </button>
          </div>
        </div>

        <!-- Color Controls Group -->
        <div class="control_group color_controls_group">
          <label class="color_group_label">Color Controls</label>

          <div class="color_layout_row">
            <div class="color_picker_item">
              <label for="color_picker">Primary</label>
              <input type="color" id="color_picker" value="#ff0000" />
            </div>

            <div class="color_picker_item">
              <label for="color_picker_2">Secondary</label>
              <input type="color" id="color_picker_2" value="#00ff00" />
            </div>

            <div class="color_preset_row">
              <label for="color_preset">Palette:</label>
              <select id="color_preset" class="color_preset_select">
                <option value="custom">Custom</option>
                <option value="sunset_glow">Sunset Glow</option>
                <option value="ocean_wave">Ocean Wave</option>
                <option value="galaxy_mix">Galaxy Mix</option>
                <option value="candy_pastel">Candy Pastel</option>
                <option value="random">Random</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="button_group">
          <button id="play_pause_button" class="play_pause_button">
            Start
          </button>
          <button id="reset_button">Reset</button>
        </div>

        <!-- Info Display -->
        <div class="info_group">
          <p>Press <kbd>Space</kbd> to Start/Stop</p>
          <p>Press <kbd>R</kbd> to Reset</p>
        </div>
      </div>
    </div>

    <script id="vertex_shader" type="x-shader/x-vertex">
      #version 300 es
      in vec4 vPosition;
      in vec4 vColor;
      in vec3 vNormal;
      out vec4 color;

      // global variables
      uniform mat4 modelViewMatrix;
      uniform mat4 projectionMatrix;
      void main() {
          gl_Position = projectionMatrix * modelViewMatrix * vPosition;
          color = vColor;
      }
    </script>

    <script id="fragment_shader" type="x-shader/x-fragment">
      #version 300 es
      precision mediump float;
      in vec4 color;
      out vec4 fragColor;

      void main() {
          fragColor = color;
      }
    </script>

    <!-- Inline CSS Styles -->
    <style>
      :root {
        --orange: #f97316;
        --orange-light: #fbbf24;
        --orange-dark: #c2410c;
        --panel: #fff6e6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font: 14px "Comic Sans MS", cursive, sans-serif;
        color: #0f172a;
        background: #fff7ed url("orangeBackground.png") center/cover fixed
          no-repeat;
        display: flex;
        flex-direction: column;
      }

      #main_container {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
        margin: 16px auto;
        width: min(1500px, 100%);
      }

      #gl_canvas {
        flex: 1 1 760px;
        min-width: 560px;
        height: 1040px;
        border: 4px solid rgba(251, 191, 36, 0.8);
        border-radius: 14px;
        background: radial-gradient(circle at top, #fffdf5, #fff1d6);
        box-shadow: 0 12px 25px rgba(249, 115, 22, 0.2);
      }

      #control_panel {
        flex: 0 0 420px;
        min-width: 340px;
        background: var(--panel);
        border: 1px solid var(--orange-light);
        border-radius: 12px;
        padding: 16px;
        max-height: calc(100vh - 115px);
        overflow-y: auto;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
      }

      #page_header {
        background: linear-gradient(120deg, #f78c1f, #ffcc66);
        color: #fffdf5;
        text-align: center;
        padding: 18px 24px;
        box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
      }

      .control_group {
        margin-bottom: 12px;
        padding: 12px;
        background: #fff;
        border-radius: 10px;
        border: 1px solid rgba(249, 115, 22, 0.2);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .control_group label {
        font-weight: 600;
        color: var(--orange-dark);
      }

      .inline_control_row,
      .slider_container {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .double_control_row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .text_input,
      select {
        width: 100%;
        padding: 8px;
        border: 2px solid var(--orange);
        border-radius: 6px;
        font-weight: 600;
        color: var(--orange-dark);
        background: #fff;
      }

      .text_input:focus,
      select:focus {
        outline: 2px solid #fef3c7;
        border-color: var(--orange-dark);
      }

      #text_input {
        max-width: 260px;
      }

      input[type="range"] {
        flex: 1;
        height: 4px;
        border-radius: 4px;
        background: #fed7aa;
        accent-color: var(--orange);
      }

      .button_group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button {
        flex: 1;
        padding: 10px 16px;
        border-radius: 6px;
        border: none;
        background: #fff8eb;
        color: #b45309;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
      }

      button:hover {
        background: #ffb347;
        color: #fff;
      }

      #reset_button {
        border: 2px solid #f4a259;
        background: #fffaf2;
        color: var(--orange-dark);
      }

      #reset_button:hover {
        border-color: #f97316;
        background: #fff0de;
        color: #a94407;
      }

      .play_state {
        background: #22c55e;
        border-color: #15803d;
        color: #fff;
      }

      .pause_state {
        background: #ef4444;
        border-color: #b91c1c;
        color: #fff;
      }

      .color_controls_group {
        background: #fff6e0;
      }

      .color_layout_row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .color_picker_item {
        flex: 1;
        min-width: 120px;
        text-align: center;
      }

      .color_circle {
        width: 60px;
        height: 60px;
        margin: 0 auto;
        border-radius: 50%;
        border: 3px solid var(--orange);
        position: relative;
        overflow: hidden;
        background: #fff;
      }

      .color_circle input[type="color"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
        opacity: 0;
      }

      .header_content h1 {
        margin: 0;
        font-size: 2.6em;
        font-weight: 700;
        letter-spacing: 0.05em;
      }

      .header_content p {
        margin: 8px 0 0;
        font-size: 1.25em;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .info_group {
        padding-top: 12px;
        color: #7c2d12;
      }

      kbd {
        background: #fed7aa;
        border: 1px solid var(--orange);
        border-radius: 4px;
        padding: 2px 6px;
      }

      @media (max-width: 1024px) {
        #gl_canvas {
          min-width: 0;
          width: 100%;
          height: 60vh;
        }

        #control_panel {
          flex: 1 1 100%;
          max-height: none;
        }

        .double_control_row {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 768px) {
        .button_group {
          flex-direction: column;
        }
      }
    </style>

    <script>
      (function () {
        const bindings = [
          {
            inputId: "color_picker",
            circleSelector: '[data-circle="primary"]',
          },
          {
            inputId: "color_picker_2",
            circleSelector: '[data-circle="secondary"]',
          },
        ];

        function syncCircle(inputId, circleSelector) {
          const input = document.getElementById(inputId);
          const circle = document.querySelector(circleSelector);
          if (input && circle) {
            circle.style.background = input.value;
          }
        }

        window.refreshColorCircles = function () {
          bindings.forEach(({ inputId, circleSelector }) =>
            syncCircle(inputId, circleSelector)
          );
        };

        bindings.forEach(({ inputId, circleSelector }) => {
          syncCircle(inputId, circleSelector);
          const input = document.getElementById(inputId);
          if (input) {
            input.addEventListener("input", () =>
              syncCircle(inputId, circleSelector)
            );
          }
        });
      })();
    </script>
  </body>
</html>
